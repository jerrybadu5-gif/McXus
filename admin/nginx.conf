# Staff console: static files + the McXus API on the same origin (no CORS, token never leaves this site).
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 12m;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /v1/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
    location /media/ { proxy_pass http://api:8000; }
    location = /health { proxy_pass http://api:8000; }
    # "expires", not add_header: an add_header here would drop the security headers above for these paths.
    location /assets/ { expires 1y; try_files $uri =404; }
    location / { expires epoch; try_files $uri /index.html; }
}
