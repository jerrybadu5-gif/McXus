name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: mcxus
          POSTGRES_PASSWORD: mcxus
          POSTGRES_DB: mcxus_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U mcxus" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      MCXUS_TEST_DATABASE_URL: postgresql+psycopg://mcxus:mcxus@localhost:5432/mcxus_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest -W ignore::DeprecationWarning
      - run: pip-audit --skip-editable

  crypto:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crypto
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - run: cargo test --locked --release

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Laptop build of the encryption library so the JVM tests can exercise the real bindings.
      - run: cargo build --locked --manifest-path crypto/Cargo.toml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: mcxus-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build
