# McXus core (sandbox). Start: docker compose up -d   API docs: http://localhost:8000/docs
services:
  db:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: mcxus
      POSTGRES_PASSWORD: ${MCXUS_DB_PASSWORD:-mcxus}
      POSTGRES_DB: mcxus
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    ports:
      - "127.0.0.1:5433:5432"   # local only; 5433 so it does not clash with McLender or another Postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcxus"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    env_file: [{path: ./backend/.env, required: false}]
    environment:
      MCXUS_DATABASE_URL: postgresql+psycopg://mcxus:${MCXUS_DB_PASSWORD:-mcxus}@db:5432/mcxus
    volumes:
      - media:/app/media   # listing photos (public)
      - blobs:/app/blobs   # encrypted chat photos and voice notes (private, unreadable to the server)
      - evidence:/app/evidence   # dispute photos (private: the parties and staff only; kept with the order)
      - ./secrets:/app/secrets:ro   # optional: firebase.json for push (see docs/FIREBASE-PUSH.md)
    ports:
      - "${MCXUS_API_BIND:-127.0.0.1}:8000:8000"   # start-dev.ps1 -Lan sets 0.0.0.0 so a phone on your Wi-Fi can connect
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped

  worker:   # escrow timers, dispute deadlines (negotiation, appeal window) and 30-day deletion of chat files
    build: ./backend
    command: ["python", "-m", "app.jobs"]
    healthcheck: {disable: true}   # no web server in the worker
    env_file: [{path: ./backend/.env, required: false}]
    environment:
      MCXUS_DATABASE_URL: postgresql+psycopg://mcxus:${MCXUS_DB_PASSWORD:-mcxus}@db:5432/mcxus
    volumes:
      - blobs:/app/blobs
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

  admin:   # staff console (disputes, KYC, deposits & payouts, moderation, people, audit): http://localhost:8080
    build: ./admin
    ports:
      - "127.0.0.1:8080:8080"   # staff only: never expose this beyond the office network without a VPN
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

volumes:
  pgdata:
  media:
  blobs:
  evidence:
